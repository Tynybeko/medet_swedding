<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Сүрөттөрдү башкаруу</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="grain">

  <!-- вход -->
  <div class="admin-login" id="login-view">
    <h1 style="font-size:2rem;font-weight:500">Кирүү</h1>
    <p style="color:var(--ink-soft);margin:0.6rem 0 1.4rem">Коноктордун сүрөттөрүн текшерүү</p>
    <form id="login-form" style="display:flex;flex-direction:column;gap:0.9rem">
      <input class="rsvp-input" type="password" id="password" placeholder="Сырсөз" autocomplete="current-password" required />
      <button class="btn" type="submit">Кирүү</button>
      <p id="login-error" style="color:#a02020;font-family:var(--sans);font-size:0.8rem;min-height:1.2em"></p>
    </form>
  </div>

  <!-- панель -->
  <div class="admin-wrap" id="panel-view" hidden>
    <div class="page-head" style="padding-top:2rem">
      <h1>Коноктордун сүрөттөрү</h1>
      <p id="stats"></p>
    </div>

    <div class="admin-toolbar">
      <button class="tab-btn active" data-tab="pending">Текшерилүүдө</button>
      <button class="tab-btn" data-tab="published">Жарыяланган</button>
      <button class="tab-btn" data-tab="all">Баары</button>
      <span style="flex-basis:100%"></span>
      <button class="btn" id="publish-all" style="font-size:0.9rem;padding:0.6rem 1.5rem">✓ Жаңыларын жарыялоо</button>
      <a class="btn btn-ghost" href="/album.html" style="font-size:0.9rem;padding:0.6rem 1.5rem">Альбом</a>
    </div>

    <section class="qr-settings">
      <h2>Коноктор үчүн QR барактары</h2>
      <p>Ар бир топко ат жана басып чыгара турган барактардын санын жазыңыз.</p>
      <div id="qr-groups" class="qr-groups"></div>
      <div class="qr-settings-actions">
        <button class="btn btn-ghost" type="button" id="add-qr-group">+ Топ кошуу</button>
        <button class="btn" type="button" id="download-qr-pdf">PDF жүктөө</button>
        <button class="btn btn-ghost" type="button" id="print-qr-pages">Басып чыгаруу</button>
      </div>
    </section>

    <div class="admin-grid" id="grid"></div>
    <p class="album-empty" id="empty" hidden>Бул бөлүмдө азырынча сүрөт жок.</p>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/vendor/gsap/gsap.min.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
