<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR — Сүрөттөр менен бөлүшүңүз</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="grain" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem 1rem">

  <div class="qr-card" id="card">
    <p class="section-num" data-t="meta.couple">Кылымбек жана Мырзагул</p>
    <h1 style="font-size:clamp(1.8rem,5vw,2.4rem);font-weight:500" data-t="qr.title">Көз ирмемдер менен бөлүшүңүз!</h1>
    <p style="color:var(--ink-soft);margin-top:0.7rem;line-height:1.55" data-t="qr.subtitle">
      Телефонуңуздун камерасын QR-кодго багыттап, сүрөттөрдү той альбомуна жүктөңүз.
    </p>
    <img id="qr-img" alt="Сүрөт жүктөө үчүн QR-код" />
    <p class="qr-hint" data-t="qr.hint">Ар бир конок 10 сүрөткө чейин жүктөй алат</p>
    <p class="qr-url" id="qr-url"></p>
    <div class="no-print" style="margin-top:1.6rem;display:flex;gap:0.7rem;justify-content:center;flex-wrap:wrap">
      <a class="btn" href="/api/qr.pdf">⬇ Басып чыгаруу үчүн PDF</a>
      <button class="btn btn-ghost" onclick="window.print()">🖨 Басып чыгаруу</button>
      <a class="btn btn-ghost" href="/">← Башкы бетке</a>
    </div>
  </div>

  <script src="/vendor/gsap/gsap.min.js"></script>
  <script src="/js/content.js"></script>
  <script>
    gsap.from('#card', { opacity: 0, y: 40, scale: 0.96, duration: 1, ease: 'power3.out' });
    fetch('/api/qr')
      .then((r) => r.json())
      .then(({ url, qr }) => {
        document.getElementById('qr-img').src = qr;
        document.getElementById('qr-url').textContent = url;
        gsap.from('#qr-img', { opacity: 0, scale: 0.8, duration: 0.8, delay: 0.3, ease: 'back.out(1.6)' });
      });
  </script>
</body>
</html>
