<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Загрузить фото — Salome & Nika</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="grain">

  <div class="page-head" style="padding-top:2.4rem">
    <h1 data-t="camera.title">Ваши фото</h1>
    <p data-t="camera.subtitle">Сфотографируйте момент — после одобрения пары он появится в альбоме.</p>
    <a class="page-back" href="/" data-t="album.back">← К приглашению</a>
  </div>

  <div class="camera-wrap">
    <div style="margin-bottom:1rem">
      <label class="rsvp-label" data-t="camera.nameLabel">Как вас зовут? (необязательно)</label>
      <input class="rsvp-input" id="guest-name" maxlength="60" placeholder="Имя" />
    </div>

    <div class="camera-stage" id="stage">
      <video id="video" autoplay playsinline muted></video>
      <img class="preview" id="preview" hidden />
      <div class="flash" id="flash"></div>
      <div class="camera-error" id="camera-error"></div>
    </div>

    <div class="camera-controls">
      <p class="counter-line" id="counter">…</p>

      <div id="live-controls" style="display:flex;flex-direction:column;align-items:center;gap:0.8rem">
        <button class="shutter" id="shutter" aria-label="Снять фото"></button>
        <label class="link-like" style="cursor:pointer">
          <span data-t="camera.orUpload">или выберите из галереи</span>
          <input class="gallery-input" id="file-input" type="file" accept="image/*" />
        </label>
      </div>

      <div id="confirm-controls" style="display:none;gap:0.8rem;flex-wrap:wrap;justify-content:center">
        <button class="btn" id="use-btn" data-t="camera.use">Загрузить это фото</button>
        <button class="btn btn-ghost" id="retake-btn" data-t="camera.retake">Переснять</button>
      </div>
    </div>

    <div class="mine-grid" id="mine"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/vendor/gsap/gsap.min.js"></script>
  <script src="/js/content.js"></script>
  <script src="/js/camera.js"></script>
</body>
</html>
